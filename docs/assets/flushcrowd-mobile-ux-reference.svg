<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <rect width="1600" height="980" fill="#F6F8FB"/>
  <style>
    .title{font:700 44px Arial,sans-serif;fill:#0F172A}.sub{font:400 22px Arial,sans-serif;fill:#475569}.phone{fill:#FFFFFF;stroke:#111827;stroke-width:5}.screenTitle{font:700 20px Arial,sans-serif;fill:#111827}.body{font:400 15px Arial,sans-serif;fill:#475569}.tiny{font:400 12px Arial,sans-serif;fill:#64748B}.btn{fill:#1677FF}.btnText{font:700 14px Arial,sans-serif;fill:#FFFFFF}.chip{fill:#EEF4FF;stroke:#C9DAFF}.label{font:700 15px Arial,sans-serif;fill:#0F172A}.blue{fill:#1677FF}.green{fill:#22C55E}.amber{fill:#F59E0B}.muted{fill:#E2E8F0}.card{fill:#FFFFFF;stroke:#E2E8F0;stroke-width:2}.map{fill:#EAF2E4}.road{stroke:#FFFFFF;stroke-width:16}.water{fill:#DCEEFF}.pin{fill:#1677FF;stroke:#FFFFFF;stroke-width:3}
  </style>
  <text x="70" y="75" class="title">FlushCrowd — Mobile UI/UX Reference</text>
  <text x="70" y="112" class="sub">Map-first, anonymous, global restroom discovery and contribution experience</text>

  <!-- Splash -->
  <g transform="translate(50,165)">
    <rect x="0" y="0" width="280" height="640" rx="38" class="phone"/>
    <rect x="92" y="14" width="96" height="18" rx="9" fill="#111827"/>
    <circle cx="140" cy="245" r="58" class="blue"/>
    <path d="M140 195 C115 195 96 214 96 239 C96 281 140 316 140 316 C140 316 184 281 184 239 C184 214 165 195 140 195Z" fill="#1677FF"/>
    <text x="140" y="246" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#FFFFFF">WC</text>
    <text x="140" y="340" text-anchor="middle" class="screenTitle" font-size="28">FlushCrowd</text>
    <text x="140" y="372" text-anchor="middle" class="body">Find a better loo, anywhere.</text>
    <text x="36" y="460" class="body">• Find nearby restrooms</text>
    <text x="36" y="490" class="body">• See ratings & amenities</text>
    <text x="36" y="520" class="body">• Add and verify locations</text>
    <text x="36" y="550" class="body">• No account required</text>
    <rect x="28" y="580" width="224" height="44" rx="14" class="btn"/>
    <text x="140" y="608" text-anchor="middle" class="btnText">Get Started</text>
    <text x="140" y="688" text-anchor="middle" class="label">1. Splash / Value Prop</text>
  </g>

  <!-- Map -->
  <g transform="translate(360,165)">
    <rect x="0" y="0" width="280" height="640" rx="38" class="phone"/>
    <rect x="92" y="14" width="96" height="18" rx="9" fill="#111827"/>
    <rect x="12" y="42" width="256" height="360" rx="24" class="map"/>
    <rect x="12" y="42" width="256" height="80" rx="24" class="water" opacity="0.55"/>
    <path d="M20 180 L260 110 M10 255 L270 215 M60 45 L120 395 M210 45 L175 390" class="road"/>
    <rect x="28" y="58" width="210" height="38" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="48" y="82" class="tiny">Search nearby toilets…</text>
    <circle cx="140" cy="225" r="13" fill="#1677FF" stroke="#FFFFFF" stroke-width="4"/>
    <g><path d="M95 145 c-14 0-25 11-25 25 0 22 25 42 25 42s25-20 25-42c0-14-11-25-25-25z" class="pin"/><text x="95" y="177" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">WC</text></g>
    <g><path d="M215 175 c-14 0-25 11-25 25 0 22 25 42 25 42s25-20 25-42c0-14-11-25-25-25z" class="pin"/><text x="215" y="207" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">WC</text></g>
    <g><path d="M70 290 c-14 0-25 11-25 25 0 22 25 42 25 42s25-20 25-42c0-14-11-25-25-25z" class="pin"/><text x="70" y="322" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">WC</text></g>
    <text x="24" y="438" class="screenTitle">Nearest to you</text>
    <rect x="18" y="455" width="244" height="105" rx="18" class="card"/>
    <rect x="30" y="470" width="58" height="74" rx="10" fill="#E2E8F0"/>
    <text x="100" y="485" class="label">Central Mall · Bldg A</text>
    <text x="100" y="508" class="tiny">3F · 120 m away</text>
    <text x="100" y="532" class="tiny">★ 4.6 · Open · Bidet</text>
    <rect x="208" y="515" width="40" height="20" rx="10" fill="#DCFCE7"/>
    <text x="228" y="529" text-anchor="middle" font-family="Arial" font-size="10" fill="#15803D">Open</text>
    <text x="140" y="688" text-anchor="middle" class="label">2. Map / Discovery</text>
  </g>

  <!-- Detail -->
  <g transform="translate(670,165)">
    <rect x="0" y="0" width="280" height="640" rx="38" class="phone"/>
    <rect x="92" y="14" width="96" height="18" rx="9" fill="#111827"/>
    <rect x="16" y="50" width="248" height="180" rx="20" fill="#E8EAED"/>
    <rect x="38" y="80" width="204" height="120" rx="10" fill="#D7D9DC"/>
    <text x="140" y="145" text-anchor="middle" class="body">Restroom photo / placeholder</text>
    <text x="22" y="270" class="screenTitle">Central Mall · Building A</text>
    <text x="22" y="298" class="body">3F, near cinema hallway</text>
    <text x="22" y="326" class="body">★ 4.6 (128 ratings)</text>
    <rect x="205" y="305" width="50" height="22" rx="11" fill="#DCFCE7"/>
    <text x="230" y="320" text-anchor="middle" font-family="Arial" font-size="11" fill="#15803D">Open</text>
    <text x="22" y="365" class="label">Amenities</text>
    <g transform="translate(22,382)">
      <rect width="72" height="50" rx="12" class="chip"/><text x="36" y="30" text-anchor="middle" class="tiny">Bidet</text>
      <rect x="82" width="72" height="50" rx="12" class="chip"/><text x="118" y="30" text-anchor="middle" class="tiny">Soap</text>
      <rect x="164" width="72" height="50" rx="12" class="chip"/><text x="200" y="30" text-anchor="middle" class="tiny">PWD</text>
    </g>
    <rect x="20" y="455" width="240" height="78" rx="16" fill="#EFF6FF"/>
    <text x="34" y="480" class="tiny">Indoor directions</text>
    <text x="34" y="503" class="body">Turn right after the escalator.</text>
    <rect x="20" y="555" width="112" height="44" rx="14" fill="#FFFFFF" stroke="#1677FF" stroke-width="2"/>
    <text x="76" y="583" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#1677FF">Directions</text>
    <rect x="148" y="555" width="112" height="44" rx="14" class="btn"/>
    <text x="204" y="583" text-anchor="middle" class="btnText">Rate</text>
    <text x="140" y="688" text-anchor="middle" class="label">3. Restroom Details</text>
  </g>

  <!-- Add -->
  <g transform="translate(980,165)">
    <rect x="0" y="0" width="280" height="640" rx="38" class="phone"/>
    <rect x="92" y="14" width="96" height="18" rx="9" fill="#111827"/>
    <text x="140" y="70" text-anchor="middle" class="screenTitle">Add a Restroom</text>
    <rect x="20" y="90" width="240" height="160" rx="18" class="map"/>
    <path d="M25 160 L255 120 M85 95 L115 245 M210 95 L175 245" class="road"/>
    <path d="M140 140 c-16 0-29 13-29 29 0 26 29 49 29 49s29-23 29-49c0-16-13-29-29-29z" class="pin"/>
    <text x="140" y="173" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">WC</text>
    <text x="22" y="285" class="tiny">Place / building</text><rect x="20" y="295" width="240" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="34" y="320" class="tiny">e.g. Central Mall</text>
    <text x="22" y="365" class="tiny">Floor / wing</text><rect x="20" y="375" width="240" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="34" y="400" class="tiny">e.g. 3F, North Wing</text>
    <text x="22" y="445" class="tiny">Nearest landmark</text><rect x="20" y="455" width="240" height="42" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="34" y="480" class="tiny">e.g. beside cinema</text>
    <text x="22" y="530" class="label">Amenities</text>
    <text x="22" y="555" class="tiny">Free · Bidet · Tissue · Soap · Accessible</text>
    <rect x="20" y="575" width="240" height="44" rx="14" class="btn"/>
    <text x="140" y="603" text-anchor="middle" class="btnText">Submit</text>
    <text x="140" y="688" text-anchor="middle" class="label">4. Add / Contribute</text>
  </g>

  <!-- Filters -->
  <g transform="translate(1290,165)">
    <rect x="0" y="0" width="260" height="640" rx="38" class="phone"/>
    <rect x="82" y="14" width="96" height="18" rx="9" fill="#111827"/>
    <text x="130" y="70" text-anchor="middle" class="screenTitle">Filters</text>
    <text x="22" y="110" class="label">Show me</text>
    <rect x="22" y="128" width="64" height="30" rx="15" class="btn"/><text x="54" y="148" text-anchor="middle" class="btnText">All</text>
    <rect x="95" y="128" width="78" height="30" rx="15" class="chip"/><text x="134" y="148" text-anchor="middle" class="tiny">Open now</text>
    <text x="22" y="200" class="label">Amenities</text>
    <g class="body">
      <text x="22" y="240">Free</text><circle cx="220" cy="234" r="11" class="blue"/>
      <text x="22" y="280">Clean / maintained</text><circle cx="220" cy="274" r="11" class="blue"/>
      <text x="22" y="320">Bidet</text><circle cx="220" cy="314" r="11" class="blue"/>
      <text x="22" y="360">Tissue</text><circle cx="220" cy="354" r="11" class="muted"/>
      <text x="22" y="400">Soap</text><circle cx="220" cy="394" r="11" class="blue"/>
      <text x="22" y="440">Accessible (PWD)</text><circle cx="220" cy="434" r="11" class="muted"/>
      <text x="22" y="480">Baby changing</text><circle cx="220" cy="474" r="11" class="muted"/>
      <text x="22" y="520">All gender</text><circle cx="220" cy="514" r="11" class="muted"/>
    </g>
    <rect x="20" y="575" width="220" height="44" rx="14" class="btn"/>
    <text x="130" y="603" text-anchor="middle" class="btnText">Apply Filters</text>
    <text x="130" y="688" text-anchor="middle" class="label">5. Filters</text>
  </g>

  <text x="70" y="900" class="sub">Build principle: implement the core journey from these screens before expanding backend scope.</text>
  <text x="70" y="938" class="body">Reference only — final UI may refine spacing, typography, iconography, accessibility, and platform conventions while preserving the interaction model.</text>
</svg>